version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gocritic
    - misspell
    - revive
    - sloglint
    - unconvert
    - unparam
  exclusions:
    generated: lax
    paths:
      - internal/generator/templates

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nikita/scratch
